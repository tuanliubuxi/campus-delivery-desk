{# Public landing page that directs each user to the appropriate sign-in flow. #}
{% extends "layouts/base.html" %}

{% block content %}
<main class="container py-5">
  <section class="cdd-card p-4">
    <h1>校驿</h1>
    <p class="cdd-muted">轻量、自托管的校园代取与配送运营系统。</p>
    <label for="theme" class="form-label">主题</label>
    <select id="theme" class="form-select" style="max-width: 16rem" onchange="cddSetTheme(this.value)">
      <option value="light">亮色</option>
      <option value="dark">暗色</option>
      <option value="warm">暖色</option>
      <option value="fresh">清爽蓝青</option>
    </select>
  </section>
</main>
{% endblock %}
