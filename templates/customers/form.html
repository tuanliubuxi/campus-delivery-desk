{# Shared create/edit form for normalized customer master data. #}
{% extends "layouts/base.html" %}
{% block content %}
<main class="container py-4" style="max-width: 760px">
  <div class="d-flex justify-content-between align-items-center"><h1 class="h3">{{ title }}</h1><a class="btn btn-outline-secondary" href="{% url 'customers:list' %}">返回列表</a></div>
  <section class="cdd-card p-3"><form method="post" novalidate>{% csrf_token %}{{ form.as_p }}<div class="d-flex flex-wrap gap-2"><button class="btn btn-primary cdd-touch">{% if customer %}保存客户修改{% else %}创建新客户{% endif %}</button>{% if customer %}<button class="btn btn-outline-danger cdd-touch" type="submit" form="customer-delete-form">删除</button>{% endif %}</div></form>{% if customer %}<form id="customer-delete-form" method="post" action="{% url 'customers:delete' customer.id %}" onsubmit="return confirm('只有没有业务记录的客户可以删除。确认继续？')">{% csrf_token %}</form>{% endif %}</section>
</main>
{% endblock %}
