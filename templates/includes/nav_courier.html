{% with view=request.resolver_match.view_name %}
<div class="cdd-nav-group cdd-nav-group--overview {% if view == 'dispatch:task-list' or view == 'dispatch:new-tasks' or view == 'dispatch:express-route-pool' or view == 'dispatch:express-direct-pool' %}is-active{% endif %}"><span class="cdd-nav-label">任务</span><a href="{% url 'dispatch:task-list' %}" class="{% if view == 'dispatch:task-list' %}is-current{% endif %}">我的任务</a>{% if user.accepting_business == 'EXPRESS' %}<a href="{% url 'dispatch:express-route-pool' %}" class="{% if view == 'dispatch:express-route-pool' %}is-current{% endif %}">路线接单</a><a href="{% url 'dispatch:express-direct-pool' %}" class="{% if view == 'dispatch:express-direct-pool' %}is-current{% endif %}">客户直送</a>{% else %}<a href="{% url 'dispatch:new-tasks' %}" class="{% if view == 'dispatch:new-tasks' %}is-current{% endif %}">接新任务</a>{% endif %}</div>
<div class="cdd-nav-group cdd-nav-group--business {% if view == 'dispatch:transfers' or request.resolver_match.namespace == 'consolidation' %}is-active{% endif %}"><span class="cdd-nav-label">协作</span><a href="{% url 'dispatch:transfers' %}" class="{% if view == 'dispatch:transfers' %}is-current{% endif %}">转单</a><a href="{% url 'consolidation:courier-list' %}" class="{% if request.resolver_match.namespace == 'consolidation' %}is-current{% endif %}">归拢</a></div>
<div class="cdd-nav-group cdd-nav-group--risk {% if request.resolver_match.namespace == 'exceptions' %}is-active{% endif %}"><span class="cdd-nav-label">异常</span><a href="{% url 'exceptions:courier-workspace' %}" class="{% if request.resolver_match.namespace == 'exceptions' %}is-current{% endif %}">异常上报</a></div>
<div class="cdd-nav-group cdd-nav-group--system {% if request.resolver_match.namespace == 'accounts' or request.resolver_match.namespace == 'dashboard' %}is-active{% endif %}"><span class="cdd-nav-label">我的</span><a href="{% url 'accounts:courier-dashboard' %}" class="{% if view == 'accounts:courier-dashboard' %}is-current{% endif %}">接单设置</a><a href="{% url 'dashboard:courier-statistics' %}" class="{% if view == 'dashboard:courier-statistics' %}is-current{% endif %}">个人统计</a></div>
<div class="cdd-mobile-categories"><a class="cdd-cat-overview" href="{% url 'dispatch:task-list' %}">任务</a><a class="cdd-cat-business" href="{% url 'dispatch:transfers' %}">协作</a><a class="cdd-cat-risk" href="{% url 'exceptions:courier-workspace' %}">异常</a><a class="cdd-cat-system" href="{% url 'accounts:courier-dashboard' %}">我的</a></div>
{% endwith %}
