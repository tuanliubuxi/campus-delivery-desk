{% with view=request.resolver_match.view_name %}
<div class="cdd-nav-group cdd-nav-group--overview {% if view == 'accounts:admin-dashboard' or view == 'dashboard:reports' or view == 'dashboard:global-search' %}is-active{% endif %}"><span class="cdd-nav-label">总览</span><a href="{% url 'accounts:admin-dashboard' %}" class="{% if view == 'accounts:admin-dashboard' %}is-current{% endif %}">工作台</a><a href="{% url 'dashboard:reports' %}" class="{% if view == 'dashboard:reports' %}is-current{% endif %}">经营分析</a><a href="{% url 'dashboard:global-search' %}" class="{% if view == 'dashboard:global-search' %}is-current{% endif %}">搜索</a></div>
<div class="cdd-nav-group cdd-nav-group--business {% if request.resolver_match.namespace == 'orders' or request.resolver_match.namespace == 'customers' or request.resolver_match.namespace == 'agents' or request.resolver_match.namespace == 'consolidation' %}is-active{% endif %}"><span class="cdd-nav-label">业务</span><a href="{% url 'orders:new' %}" class="{% if view == 'orders:new' %}is-current{% endif %}">录单</a><a href="{% url 'orders:quick-complete' %}" class="{% if view == 'orders:quick-complete' %}is-current{% endif %}">快速补录</a><a href="{% url 'orders:history' %}" class="{% if request.resolver_match.namespace == 'orders' and view != 'orders:new' and view != 'orders:quick-complete' %}is-current{% endif %}">订单</a><a href="{% url 'customers:list' %}" class="{% if request.resolver_match.namespace == 'customers' %}is-current{% endif %}">客户</a><a href="{% url 'agents:workspace' %}" class="{% if request.resolver_match.namespace == 'agents' %}is-current{% endif %}">代理</a><a href="{% url 'consolidation:manual-create' %}" class="{% if request.resolver_match.namespace == 'consolidation' %}is-current{% endif %}">归拢</a></div>
<div class="cdd-nav-group cdd-nav-group--finance {% if request.resolver_match.namespace == 'settlements' %}is-active{% endif %}"><span class="cdd-nav-label">财务</span><a href="{% url 'settlements:workspace' %}" class="{% if view == 'settlements:workspace' %}is-current{% endif %}">结算</a><a href="{% url 'settlements:wages' %}" class="{% if view == 'settlements:wages' %}is-current{% endif %}">收益与工资</a></div>
<div class="cdd-nav-group cdd-nav-group--risk {% if request.resolver_match.namespace == 'exceptions' or view == 'operations:media' %}is-active{% endif %}"><span class="cdd-nav-label">风控</span><a href="{% url 'exceptions:workspace' %}" class="{% if request.resolver_match.namespace == 'exceptions' %}is-current{% endif %}">异常处理</a><a href="{% url 'operations:media' %}" class="{% if view == 'operations:media' %}is-current{% endif %}">媒体</a></div>
<div class="cdd-nav-group cdd-nav-group--system {% if view == 'accounts:user-list' or view == 'accounts:login-history' or view == 'accounts:audit-logs' or request.resolver_match.namespace == 'config_center' or view == 'operations:backups' %}is-active{% endif %}"><span class="cdd-nav-label">系统</span><a href="{% url 'accounts:user-list' %}" class="{% if view == 'accounts:user-list' or view == 'accounts:login-history' %}is-current{% endif %}">人员</a><a href="{% url 'accounts:audit-logs' %}" class="{% if view == 'accounts:audit-logs' %}is-current{% endif %}">日志</a><a href="{% url 'config_center:index' %}" class="{% if request.resolver_match.namespace == 'config_center' %}is-current{% endif %}">配置</a><a href="{% url 'operations:backups' %}" class="{% if view == 'operations:backups' %}is-current{% endif %}">备份维护</a></div>
<div class="cdd-mobile-categories"><a class="cdd-cat-overview {% if view == 'accounts:admin-dashboard' or view == 'dashboard:reports' or view == 'dashboard:global-search' %}is-current{% endif %}" href="{% url 'accounts:admin-dashboard' %}">总览</a><a class="cdd-cat-business {% if request.resolver_match.namespace == 'orders' or request.resolver_match.namespace == 'customers' or request.resolver_match.namespace == 'agents' or request.resolver_match.namespace == 'consolidation' %}is-current{% endif %}" href="{% url 'orders:new' %}">业务</a><a class="cdd-cat-finance {% if request.resolver_match.namespace == 'settlements' %}is-current{% endif %}" href="{% url 'settlements:workspace' %}">财务</a><a class="cdd-cat-risk {% if request.resolver_match.namespace == 'exceptions' or view == 'operations:media' %}is-current{% endif %}" href="{% url 'exceptions:workspace' %}">风控</a><a class="cdd-cat-system {% if view == 'accounts:user-list' or view == 'accounts:login-history' or view == 'accounts:audit-logs' or request.resolver_match.namespace == 'config_center' or view == 'operations:backups' %}is-current{% endif %}" href="{% url 'accounts:user-list' %}">系统</a></div>
{% endwith %}
