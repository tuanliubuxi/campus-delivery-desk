{% with view=request.resolver_match.view_name %}
<div class="cdd-nav-group cdd-nav-group--overview {% if view == 'dashboard:global-search' or view == 'orders:history' %}is-active{% endif %}"><span class="cdd-nav-label">工作台</span><a href="{% url 'orders:history' %}" class="{% if view == 'orders:history' %}is-current{% endif %}">订单</a><a href="{% url 'dashboard:global-search' %}" class="{% if view == 'dashboard:global-search' %}is-current{% endif %}">搜索</a></div>
<div class="cdd-nav-group cdd-nav-group--business {% if view == 'orders:new' or view == 'orders:quick-complete' %}is-active{% endif %}"><span class="cdd-nav-label">录单</span><a href="{% url 'orders:new' %}" class="{% if view == 'orders:new' %}is-current{% endif %}">普通录单</a><a href="{% url 'orders:quick-complete' %}" class="{% if view == 'orders:quick-complete' %}is-current{% endif %}">快速补录</a></div>
<div class="cdd-nav-group cdd-nav-group--customer {% if request.resolver_match.namespace == 'customers' or request.resolver_match.namespace == 'agents' %}is-active{% endif %}"><span class="cdd-nav-label">客户</span><a href="{% url 'customers:list' %}" class="{% if request.resolver_match.namespace == 'customers' %}is-current{% endif %}">客户</a><a href="{% url 'agents:workspace' %}" class="{% if request.resolver_match.namespace == 'agents' %}is-current{% endif %}">代理</a></div>
<div class="cdd-nav-group cdd-nav-group--risk {% if request.resolver_match.namespace == 'settlements' or request.resolver_match.namespace == 'exceptions' or request.resolver_match.namespace == 'consolidation' %}is-active{% endif %}"><span class="cdd-nav-label">交付</span><a href="{% url 'consolidation:manual-create' %}" class="{% if request.resolver_match.namespace == 'consolidation' %}is-current{% endif %}">归拢</a><a href="{% url 'settlements:workspace' %}" class="{% if request.resolver_match.namespace == 'settlements' %}is-current{% endif %}">结算</a><a href="{% url 'exceptions:workspace' %}" class="{% if request.resolver_match.namespace == 'exceptions' %}is-current{% endif %}">异常</a></div>
<div class="cdd-mobile-categories"><a class="cdd-cat-overview" href="{% url 'orders:history' %}">工作台</a><a class="cdd-cat-business" href="{% url 'orders:new' %}">录单</a><a class="cdd-cat-customer" href="{% url 'customers:list' %}">客户</a><a class="cdd-cat-risk" href="{% url 'settlements:workspace' %}">交付</a></div>
{% endwith %}
