{% if available_evidence %}<p class="small cdd-muted">原始证据须登录并具备业务访问权限；凭证重建不会恢复已清理的图片。</p><div class="cdd-evidence-images">{% for evidence in available_evidence %}<div class="border-bottom py-2"><span class="small">原始图片 #{{ evidence.pk }} · {{ evidence.created_at|date:'Y-m-d H:i' }}</span><a class="btn btn-sm btn-outline-primary ms-2" href="{% url 'mediafiles:download' evidence.pk %}" download>下载原图</a><img class="d-block mt-2" style="max-width:100%;max-height:35vh;object-fit:contain" loading="lazy" src="{% url 'mediafiles:download' evidence.pk %}" alt="原始证据 #{{ evidence.pk }}"></div>{% endfor %}</div>{% else %}<p class="small cdd-muted">暂无可查看的原始配送／归拢证据，可能已按保留策略清理。</p>{% endif %}
