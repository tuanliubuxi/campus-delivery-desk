<dialog class="cdd-modal" id="customer-picker" data-customer-picker-url="{% url 'customers:picker' %}"><div class="cdd-modal-panel"><button class="cdd-modal-close" type="button" data-cdd-modal-close aria-label="关闭">×</button><h2 class="h5" data-customer-picker-title>搜索客户</h2><p class="small cdd-muted">也可关闭窗口，继续使用订单表单中的客户下拉框。</p><div data-customer-search-field><label class="form-label" for="customer-picker-query">微信昵称／收件人／手机尾号</label><input class="form-control" id="customer-picker-query" type="search" autocomplete="off"></div><div data-customer-building-field hidden><label class="form-label" for="customer-picker-building">楼栋</label><select class="form-select" id="customer-picker-building"><option value="">请选择楼栋</option>{% for building in picker_buildings %}<option value="{{ building.pk }}">{{ building.name }}</option>{% endfor %}</select></div><button class="btn btn-outline-primary mt-3" type="button" data-customer-picker-search>查找客户</button><p class="small cdd-muted mt-2" data-customer-picker-message aria-live="polite"></p><div class="cdd-scroll-region cdd-customer-picker-results" data-customer-picker-results></div><div class="cdd-action-row justify-content-center mt-3"><button class="btn btn-primary" type="button" data-customer-picker-confirm disabled>选中客户</button><button class="btn btn-outline-secondary" type="button" data-cdd-modal-close>取消</button></div></div></dialog>
