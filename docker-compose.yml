# Single-host V1 production topology: Django web, scheduler, and Caddy proxy.
# The explicit project/image names let an offline image archive work from any folder name.
name: campus-delivery-desk

services:
  web:
    image: campus-delivery-desk-app:local
    build: .
    command: >
      sh -c "mkdir -p /data/db /data/media /data/backups /data/tmp /data/logs
      && python manage.py collectstatic --noinput
      && python manage.py recovery_check
      && gunicorn config.wsgi:application --workers 2 --threads 4 --timeout 60 --bind 0.0.0.0:8000"
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    volumes:
      # Business data stays on the host; collected static files are shared read-only with Caddy.
      - ./data:/data
      - static_data:/app/staticfiles
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  scheduler:
    # Scheduler is a separate process but calls the same Django service layer as web requests.
    image: campus-delivery-desk-app:local
    command: >
      sh -c "mkdir -p /data/db /data/media /data/backups /data/tmp /data/logs
      && python manage.py run_scheduler"
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    volumes:
      - ./data:/data
    restart: unless-stopped

  caddy:
    # Caddy is the only service exposed to the host and terminates HTTPS.
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      # Preserve the public scheme when an upstream gateway forwards HTTPS over local HTTP.
      PUBLIC_SCHEME: ${PUBLIC_SCHEME:-https}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static_data:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped

volumes:
  static_data:
  caddy_data:
  caddy_config:
